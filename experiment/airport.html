<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SKYTERM // DEPARTURE CONTROL SYSTEM</title>
<style>
  :root{
    --green:#3dff7a;
    --dim:#1c7a3d;
    --amber:#ffb000;
    --bg:#050b06;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    font-family:'Courier New', Courier, monospace;
    color:var(--green);
    overflow:hidden;
  }
  body{
    background-image:
      repeating-linear-gradient(rgba(0,0,0,0) 0px, rgba(0,0,0,0) 1px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0) 3px);
  }
  #screen{
    position:relative;
    width:100%;height:100%;
    display:flex;flex-direction:column;
    text-shadow:0 0 4px rgba(61,255,122,0.65);
  }
  #screen::after{
    content:"";
    pointer-events:none;
    position:absolute;inset:0;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.55) 100%);
  }
  #header{
    flex:0 0 auto;
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 16px;
    border-bottom:1px solid var(--dim);
    font-size:13px;letter-spacing:1px;
  }
  #header .title{color:var(--amber);font-weight:bold;}
  #output{
    flex:1 1 auto;
    overflow-y:auto;
    padding:12px 16px;
    font-size:14px;
    line-height:1.45;
    white-space:pre-wrap;
    word-break:break-word;
  }
  #output::-webkit-scrollbar{width:8px;}
  #output::-webkit-scrollbar-thumb{background:var(--dim);}
  .line{margin:0 0 2px 0;}
  .sys{color:var(--green);}
  .amber{color:var(--amber);}
  .err{color:#ff4d4d;}
  .dim{color:var(--dim);}
  .echo{color:#fff;}
  .rule{color:var(--dim);}
  .btn-bar{
    display:flex;
    gap:8px;
    padding:6px 16px;
    background:#0a140b;
    border-top:1px solid var(--dim);
    flex-wrap:wrap;
  }
  .term-btn{
    background:transparent;
    border:1px solid var(--dim);
    color:var(--green);
    font-family:inherit;
    font-size:12px;
    padding:4px 10px;
    cursor:pointer;
    border-radius:3px;
    transition:all 0.15s ease;
  }
  .term-btn:hover{
    background:var(--dim);
    color:#fff;
  }
  .term-btn.highlight{
    border-color:var(--amber);
    color:var(--amber);
  }
  .term-btn.highlight:hover{
    background:var(--amber);
    color:#000;
  }
  #inputRow{
    flex:0 0 auto;
    display:flex;align-items:center;
    padding:8px 16px 14px 16px;
    border-top:1px solid var(--dim);
    font-size:14px;
  }
  #promptLabel{white-space:pre;color:var(--amber);margin-right:6px;}
  #cmdInput{
    flex:1;background:transparent;border:none;outline:none;
    color:#fff;font-family:inherit;font-size:14px;
    caret-color:var(--green);
  }
  #clock{font-size:12px;color:var(--dim);}
</style>
</head>
<body>
<div id="screen">
  <div id="header">
    <div class="title">SKYTERM v3.2 — DEPARTURE CONTROL TERMINAL</div>
    <div id="clock">--:--:--</div>
  </div>
  <div class="btn-bar">
    <button class="term-btn highlight" onclick="connectMunbynPrinter()">⚡ CONNECT MUNBYN (WebUSB)</button>
    <button class="term-btn" onclick="toggleFallbackMode()">🖨️ PRINTER MODE: <span id="modeStatus">POPUP / DRIVER</span></button>
    <button class="term-btn" onclick="handleInput('help')">? HELP</button>
    <button class="term-btn" onclick="handleInput('schdl')">+ SCHDL</button>
    <button class="term-btn" onclick="handleInput('brd')">✈️ BOARD</button>
  </div>
  <div id="output"></div>
  <div id="inputRow">
    <span id="promptLabel">SKYTERM&gt;</span>
    <input id="cmdInput" autocomplete="off" autocapitalize="off" spellcheck="false" />

</div>

<script>

  "William","Barbara","Richard","Susan","Joseph","Jessica","Thomas","Sarah","Charles","Karen",

  "Hernandez","Lopez","Wilson","Anderson","Thomas","Taylor","Moore","Jackson","Martin","Lee",

/* ---------------- printer bridge state ---------------- */
let usbPrinterDevice = null;
let printerInterfaceNumber = null;
let printerEndpointOut = null;
let directPrintEnabled = false;
let forcePopupPrintMode = true; // Default to web popup mode for reliable out-of-box printing

let manualCustomerMode = true; // true = new customer booking flow, false = old batch schdl flow

function toggleMode() {
  manualCustomerMode = !manualCustomerMode;
  if (manualCustomerMode) {
    printLine("SYSTEM MODE: CUSTOMER BOOKING ('SCHDL' for phone booking, 'SCHDLFLIGHT' for batch)", "amber");
  } else {
    printLine("SYSTEM MODE: BATCH SCHDL (Classic quick flight generation)", "amber");
  }
  playConfirm();
}

function toggleFallbackMode() {
  forcePopupPrintMode = !forcePopupPrintMode;
  const statusEl = document.getElementById("modeStatus");
  if (forcePopupPrintMode) {
    statusEl.textContent = "POPUP / DRIVER";
    printLine("Printer Mode set to OS Driver Popup Window.", "amber");
  } else {
    statusEl.textContent = "DIRECT ESC/POS (USB)";
    printLine("Printer Mode set to Direct WebUSB raw ESC/POS commands.", "amber");
  }
  playConfirm();
}

async function connectMunbynPrinter() {
  if (!navigator.usb) {
    printLine("WebUSB is not supported in this browser. Please use Chrome, Edge, or Opera.", "err");
    playError();
    return;
  }
  try {
    printLine("Requesting USB device selection...", "dim");
    usbPrinterDevice = await navigator.usb.requestDevice({
      filters: [] // Empty filter so user can select any connected printer device
    });
    
    printLine(`Device selected: ${usbPrinterDevice.productName || 'USB Printer'} (Vendor ID: 0x${usbPrinterDevice.vendorId.toString(16)})`, "sys");
    
    await usbPrinterDevice.open();
    if (usbPrinterDevice.configuration === null) {
      await usbPrinterDevice.selectConfiguration(1);
    }
    
    // Find interface and endpoint for output
    let found = false;
    for (const conf of usbPrinterDevice.configurations) {
      for (const intf of conf.interfaces) {
        for (const alt of intf.alternate.endpoints) {
          if (alt.direction === 'out') {
            printerInterfaceNumber = intf.interfaceNumber;
            printerEndpointOut = alt.endpointNumber;
            found = true;
            break;
          }
        }
        if (found) break;
      }
      if (found) break;
    }

    if (printerInterfaceNumber === null && usbPrinterDevice.configurations[0]?.interfaces[0]) {
      printerInterfaceNumber = usbPrinterDevice.configurations[0].interfaces[0].interfaceNumber;
      printerEndpointOut = 1; // Fallback default endpoint
    }

    await usbPrinterDevice.claimInterface(printerInterfaceNumber);
    directPrintEnabled = true;
    forcePopupPrintMode = false;
    document.getElementById("modeStatus").textContent = "DIRECT ESC/POS (USB)";
    printLine(`SUCCESS! Connected directly to ${usbPrinterDevice.productName || 'Thermal Printer'}!`, "amber");
    playConfirm();
  } catch (err) {
    if (err.name === "SecurityError" || err.message.includes("Access denied")) {
      printRule();
      printLine("⚠️ ACCESS DENIED ERROR DETECTED", "err");
      printLine("Your Operating System (Windows/Mac) has locked this USB printer because the official printer driver is running.", "sys");
      printLine("HOW TO FIX THIS:", "amber");
      printLine("  Option 1 (Easiest): Use 'POPUP / DRIVER' mode! The app will open standard print dialogs that print directly using your installed MUNBYN driver.", "sys");
      printLine("  Option 2 (Raw WebUSB Direct): On Windows, open Zadig (zadig.akeo.ie) and swap the driver for your printer to WinUSB.", "sys");
      printRule();
    } else {
      printLine(`Printer connection issue: ${err.message}`, "err");
    }
    playError();
  }
}

async function sendRawToPrinter(uint8Array) {
  if (!directPrintEnabled || !usbPrinterDevice) {
    return false; // Fallback to popup window printing
  }
  try {
    await usbPrinterDevice.transferOut(printerEndpointOut, uint8Array);
    return true;
  } catch (err) {
    printLine(`Direct print transmission error: ${err.message}`, "err");
    directPrintEnabled = false;
    return false;
  }
}

/* Helper to build robust ESC/POS byte commands for MUNBYN POS-80 including native hardware barcodes */
function buildEscPosText(textLines, barcodesArray = []) {
  let bytes = [];
  bytes.push(0x1B, 0x40);
  bytes.push(0x1B, 0x61, 0x01);

  for (let line of textLines) {
    if (line.bold) {
      bytes.push(0x1B, 0x45, 0x01);
    } else {
      bytes.push(0x1B, 0x45, 0x00);
    }
    if (line.size === 'big') {
      bytes.push(0x1D, 0x21, 0x11);
    } else if (line.size === 'med') {
      bytes.push(0x1D, 0x21, 0x01);
    } else {
      bytes.push(0x1D, 0x21, 0x00);
    }
    
    for (let i = 0; i < line.text.length; i++) {
      bytes.push(line.text.charCodeAt(i) & 0xFF);
    }
    bytes.push(0x0A);
  }

  for (let bc of barcodesArray) {
    bytes.push(0x0A);
    bytes.push(0x1D, 0x48, 0x02);
    bytes.push(0x1D, 0x68, 0x50);
    bytes.push(0x1D, 0x77, 0x02);

    bytes.push(0x1D, 0x6B, 0x49, bc.length + 2, 0x7B, 0x42);
    for (let i = 0; i < bc.length; i++) {
      bytes.push(bc.charCodeAt(i) & 0xFF);
    }
    bytes.push(0x0A, 0x0A);
  }

  bytes.push(0x0A, 0x0A);
  bytes.push(0x1D, 0x56, 0x42, 0x00);
  return new Uint8Array(bytes);
}

/* ---------------- storage ---------------- */
const STORE_KEY = "skyterm_data_v2";
let data = loadData();

function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { flights:{}, passengers:{}, usedNumbers:{}, usedFlightNumbers:{} };
}
function saveData(){
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
}

/* ---------------- helpers ---------------- */
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[randInt(0,arr.length-1)]; }

function randomDigits(n){
  let s = "";
  for(let i=0;i<n;i++) s += randInt(0,9);
  return s;
}
function generateUniqueNumber(){
  let n;
  do { n = randomDigits(10); } while(data.usedNumbers[n]);
  data.usedNumbers[n] = true;
  return n;
}
function generateBagTag(){
  let n;
  do { n = "BG" + randomDigits(6); } while(data.usedNumbers[n]);
  data.usedNumbers[n] = true;
  return n;
}
function generateFlightNumber(){
  const airline = pick(AIRLINES);
  let num;
  do { num = airline.code + randInt(100,999); } while(data.usedFlightNumbers[num]);
  data.usedFlightNumbers[num] = true;
  return { flightNumber:num, airlineName:airline.name };
}
function randomName(){
  return pick(FIRST_NAMES) + " " + pick(LAST_NAMES);
}
function randomSeat(usedSeats, capacity){
  const rows = Math.ceil(capacity/6);
  const letters = ["A","B","C","D","E","F"];
  let attempts = 0;
  while(attempts < 500){
    const s = randInt(1,rows) + pick(letters);
    if(!usedSeats.has(s)){ usedSeats.add(s); return s; }
    attempts++;
  }
  return null;
}
function nowTimeString(offsetMinutes=0){
  const d = new Date(Date.now() + offsetMinutes*60000);
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12:false});
}
function todayString(){
  const d = new Date();
  return d.toLocaleDateString();
}

/* ---------------- audio ---------------- */
let audioCtx = null;
function ctx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  return audioCtx;
}
function beep(freq, duration, type, vol){
  const ac = ctx();
  if(!ac) return;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = type || "square";
  osc.frequency.value = freq;
  gain.gain.value = vol!==undefined ? vol : 0.04;
  osc.connect(gain); gain.connect(ac.destination);
  const t = ac.currentTime;
  gain.gain.setValueAtTime(gain.gain.value, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + duration/1000);
  osc.start(t);
  osc.stop(t + duration/1000 + 0.02);
}
function playKeyClick(){ beep(randInt(700,1100), 12, "square", 0.02); }
function playScanBeep(){ beep(1900, 90, "square", 0.05); setTimeout(()=>beep(2300,70,"square",0.05), 100); }
function playError(){ beep(160, 220, "sawtooth", 0.05); }
function playConfirm(){ beep(880, 60, "sine", 0.04); setTimeout(()=>beep(1320,70,"sine",0.04),70); }
function playPrintSound(ticks){
  const n = ticks || 22;
  for(let i=0;i<n;i++){
    setTimeout(()=>beep(180+randInt(0,140), 18, "square", 0.025), i*45);
  }
}

/* ---------------- terminal I/O ---------------- */
const outputEl = document.getElementById("output");
const inputEl = document.getElementById("cmdInput");
const promptLabel = document.getElementById("promptLabel");

function printLine(text, cls){
  const div = document.createElement("div");
  div.className = "line " + (cls||"sys");
  div.textContent = text;
  outputEl.appendChild(div);
  outputEl.scrollTop = outputEl.scrollHeight;
}
function printBlock(text, cls){
  text.split("\n").forEach(l => printLine(l, cls));
}
function printRule(){
  printLine("------------------------------------------------------------", "rule");
}
function clearScreen(){
  outputEl.innerHTML = "";
}
function echoInput(val){
  printLine(promptLabel.textContent + " " + val, "echo");
}

/* ---------------- state machine ---------------- */
const state = {
  mode: "idle",       // idle | schdl_dest | schdl_aircraft | schdl_count | manual_dest | manual_count | manual_names | manual_address | addbg_weight | brd_flight | boarding
  currentPassenger: null,
  boardingFlight: null,
  schdl: {},
  manualBooking: {}   // destination, paxCount, names:[], address:''
};

function updatePrompt(){
  if(state.mode === "boarding"){ promptLabel.textContent = "BOARD[" + state.boardingFlight + "]>"; return; }
  if(state.mode === "brd_flight"){ promptLabel.textContent = "BOARD>"; return; }
  if(state.mode.startsWith("schdl")){ promptLabel.textContent = "SCHDLFLIGHT>"; return; }
  if(state.mode.startsWith("manual_")){ promptLabel.textContent = "BOOKING>"; return; }
  if(state.mode === "addbg_weight"){ promptLabel.textContent = "BAG>"; return; }
  if(state.currentPassenger && data.passengers[state.currentPassenger]){
    const p = data.passengers[state.currentPassenger];
    const shortName = p.name.split(" ")[1] || p.name;
    promptLabel.textContent = "SKYTERM[" + shortName.toUpperCase() + "]>";
  } else {
    promptLabel.textContent = "SKYTERM>";
  }
}

/* ---------------- boot ---------------- */
function boot(){
  printBlock(
`SKYTERM DEPARTURE CONTROL SYSTEM — v4.0 (Customer Phone Booking Enabled)
(c) fictional airline systems, for simulation & training use only
Terminal ready.

Type HELP for commands. Type MODE to toggle between Manual Customer Booking and Batch Flight Scheduling.`, "amber");
  printRule();
  updatePrompt();
}

/* ---------------- help ---------------- */
function showHelp(){
  printBlock(
`AVAILABLE COMMANDS
  PRINTER        connect MUNBYN POS-80 thermal printer via WebUSB
  MODE           toggle between Manual Booking Mode and Batch Schdl Mode
  HELP           show this list
  SCHDL          [Manual Mode] customer calls for booking (destination, pax, names, address, check-in slips)
                 [Batch Mode] classic batch flight creation
  SCHDLFLIGHT    [Always available] schedule a whole flight instantly
  [scan barcode] scan 10-digit check-in barcode to activate passenger
  ADDBG          add a bag for active passenger
  PTPS           print boarding pass for active passenger
  BRD            board a flight
  FLIGHTS        list scheduled flights
  CLEAR          clear screen`, "sys");
}

function showFlights(){
  const keys = Object.keys(data.flights);
  if(keys.length===0){ printLine("No flights scheduled yet. Type SCHDL to book or SCHDLFLIGHT to create batch.", "dim"); return; }
  printLine("SCHEDULED FLIGHTS", "amber");
  keys.forEach(fn=>{
    const f = data.flights[fn];
    const total = f.passengerCodes.length;
    const checkedIn = f.passengerCodes.filter(c=>data.passengers[c].checkedIn).length;
    const boarded = f.passengerCodes.filter(c=>data.passengers[c].boarded).length;
    printLine(`  ${fn}  ${f.airlineName}  ->  ${f.destCode} ${f.destName}  |  ${f.aircraftName}  |  pax ${checkedIn}/${total} checked-in, ${boarded} boarded`, "sys");
  });
}

/* ---------------- CLASSIC SCHDLFLIGHT & SCHDL (Batch) ---------------- */
function startSchdlFlight(){
  state.mode = "schdl_dest";
  state.schdl = {};
  printLine("SCHEDULE BATCH FLIGHT (SCHDLFLIGHT)", "amber");
  printLine("Select destination:", "sys");
  DESTINATIONS.forEach((d,i)=> printLine(`  ${i+1}) ${d.code}  ${d.name}`, "sys"));
  printLine("Enter destination code or number:", "amber");
  updatePrompt();
}
function handleSchdlDest(val){
  const idx = parseInt(val,10);
  let dest = null;
  if(!isNaN(idx) && DESTINATIONS[idx-1]) dest = DESTINATIONS[idx-1];
  else dest = DESTINATIONS.find(d=>d.code.toLowerCase() === val.toLowerCase());
  if(!dest){
    printLine(`Unrecognized destination "${val}". Try a code like LAX, or 1-10.`, "err");
    playError();
    return;
  }
  state.schdl.dest = dest;
  state.mode = "schdl_aircraft";
  printLine(`Destination set: ${dest.code} - ${dest.name}`, "sys");
  printLine("Select aircraft type:", "sys");
  AIRCRAFT.forEach((a,i)=> printLine(`  ${i+1}) ${a.code}  ${a.name}  (capacity ${a.capacity})`, "sys"));
  printLine("Enter aircraft number or code:", "amber");
  updatePrompt();
}
function handleSchdlAircraft(val){
  const idx = parseInt(val,10);
  let ac = null;
  if(!isNaN(idx) && AIRCRAFT[idx-1]) ac = AIRCRAFT[idx-1];
  else ac = AIRCRAFT.find(a=>a.code.toLowerCase() === val.toLowerCase());
  if(!ac){
    printLine(`Unrecognized aircraft "${val}". Try a code like 737, or 1-5.`, "err");
    playError();
    return;
  }
  state.schdl.aircraft = ac;
  state.mode = "schdl_count";
  printLine(`Aircraft set: ${ac.name}`, "sys");
  printLine(`Enter number of passengers (1-${ac.capacity}):`, "amber");
  updatePrompt();
}
function handleSchdlCount(val){
  const n = parseInt(val,10);
  const cap = state.schdl.aircraft.capacity;
  if(isNaN(n) || n < 1 || n > cap){
    printLine(`Enter a number between 1 and ${cap}.`, "err");
    playError();
    return;
  }
  createBatchFlight(state.schdl.dest, state.schdl.aircraft, n);
  state.mode = "idle";
  state.schdl = {};
  updatePrompt();
}

function createBatchFlight(dest, aircraft, count){
  const {flightNumber, airlineName} = generateFlightNumber();
  const flight = {
    flightNumber, airlineName,
    destCode: dest.code, destName: dest.name,
    aircraftCode: aircraft.code, aircraftName: aircraft.name,
    createdAt: new Date().toISOString(),
    passengerCodes: []
  };
  const usedSeats = new Set();
  const passengers = [];
  for(let i=0;i<count;i++){
    const checkinCode = generateUniqueNumber();
    const seat = randomSeat(usedSeats, aircraft.capacity);
    const passenger = {
      checkinCode, name: randomName(),
      flightNumber, destCode: dest.code,
      seat, checkedIn:false, bags:[],
      boardingPassCode:null, boarded:false
    };
    data.passengers[checkinCode] = passenger;
    flight.passengerCodes.push(checkinCode);
    passengers.push(passenger);
  }
  data.flights[flightNumber] = flight;
  saveData();

  printRule();
  printLine(`Created batch flight ${flightNumber} (${airlineName}) -> ${dest.code} ${dest.name}`, "amber");
  printLine(`Aircraft: ${aircraft.name}   Passengers: ${count}`, "sys");
  printRule();
  playPrintSound(10);
}

/* ---------------- MANUAL CUSTOMER BOOKING FLOW (SCHDL) ---------------- */
function startManualBooking(){
  state.mode = "manual_dest";
  state.manualBooking = { names: [] };
  printLine("CUSTOMER PHONE BOOKING (SCHDL)", "amber");
  printLine("Select destination for customer:", "sys");
  DESTINATIONS.forEach((d,i)=> printLine(`  ${i+1}) ${d.code}  ${d.name}`, "sys"));
  printLine("Enter destination code or number:", "amber");
  updatePrompt();
}

function handleManualDest(val){
  const idx = parseInt(val,10);
  let dest = null;
  if(!isNaN(idx) && DESTINATIONS[idx-1]) dest = DESTINATIONS[idx-1];
  else dest = DESTINATIONS.find(d=>d.code.toLowerCase() === val.toLowerCase());
  if(!dest){
    printLine(`Unrecognized destination "${val}". Try a code like LAX or 1-10.`, "err");
    playError();
    return;
  }
  state.manualBooking.dest = dest;
  state.mode = "manual_count";
  printLine(`Destination set: ${dest.code} - ${dest.name}`, "sys");
  printLine("Enter number of passengers for this booking:", "amber");
  updatePrompt();
}

function handleManualCount(val){
  const count = parseInt(val, 10);
  if(isNaN(count) || count < 1 || count > 10){
    printLine("Enter a valid passenger count (1-10).", "err");
    playError();
    return;
  }
  state.manualBooking.paxTotal = count;
  state.manualBooking.names = [];
  state.mode = "manual_names";
  printLine(`Passenger count set to ${count}.`, "sys");
  printLine(`Enter name for passenger #1:`, "amber");
  updatePrompt();
}

function handleManualNames(val){
  const name = val.trim();
  if(!name){
    printLine("Passenger name cannot be blank.", "err");
    playError();
    return;
  }
  state.manualBooking.names.push(name);
  const currentIdx = state.manualBooking.names.length;
  const total = state.manualBooking.paxTotal;

  if(currentIdx < total){
    printLine(`Passenger #${currentIdx} (${name}) recorded.`, "sys");
    printLine(`Enter name for passenger #${currentIdx + 1}:`, "amber");
    updatePrompt();
  } else {
    printLine(`All ${total} passenger names recorded.`, "sys");
    state.mode = "manual_address";
    printLine("Enter customer billing/contact address:", "amber");
    updatePrompt();
  }
}

function handleManualAddress(val){
  const address = val.trim();
  if(!address){
    printLine("Address cannot be blank.", "err");
    playError();
    return;
  }
  state.manualBooking.address = address;
  finalizeManualBooking();
  state.mode = "idle";
  updatePrompt();
}

function finalizeManualBooking(){
  const booking = state.manualBooking;
  const dest = booking.dest;

  // Ensure there is an active flight for this destination or create one automatically
  let flight = Object.values(data.flights).find(f => f.destCode === dest.code);
  if(!flight){
    const {flightNumber, airlineName} = generateFlightNumber();
    const ac = AIRCRAFT[0];
    flight = {
      flightNumber, airlineName,
      destCode: dest.code, destName: dest.name,
      aircraftCode: ac.code, aircraftName: ac.name,
      createdAt: new Date().toISOString(),
      passengerCodes: []
    };
    data.flights[flightNumber] = flight;
  }

  const createdPassengers = [];
  const usedSeats = new Set(flight.passengerCodes.map(c => data.passengers[c]?.seat).filter(Boolean));

  booking.names.forEach(name => {
    const checkinCode = generateUniqueNumber();
    const seat = randomSeat(usedSeats, 32);
    const passenger = {
      checkinCode,
      name,
      flightNumber: flight.flightNumber,
      destCode: dest.code,
      seat,
      checkedIn: false,
      bags: [],
      address: booking.address,
      boardingPassCode: null,
      boarded: false
    };
    data.passengers[checkinCode] = passenger;
    flight.passengerCodes.push(checkinCode);
    createdPassengers.push(passenger);
  });
  saveData();

  printRule();
  printLine(`BOOKING CONFIRMED! Flight ${flight.flightNumber} -> ${dest.code}`, "amber");
  printLine(`Passengers: ${createdPassengers.length} | Address: ${booking.address}`, "sys");
  printLine("Printing individual check-in slips with cuts between passengers...", "sys");
  printRule();

  // Print each passenger's check-in slip sequentially with cuts between them
  printManualCustomerSlips(flight, createdPassengers, booking.address);
}

/* ---------------- ADDBG flow ---------------- */
function startAddbg(){
  if(!state.currentPassenger || !data.passengers[state.currentPassenger]){
    printLine("No active passenger. Scan a check-in barcode first.", "err");
    playError();
    return;
  }
  state.mode = "addbg_weight";
  printLine("Enter bag weight in kg:", "amber");
  updatePrompt();
}
function handleAddbgWeight(val){
  const w = parseFloat(val);
  if(isNaN(w) || w <= 0 || w > 45){
    printLine("Enter a valid weight in kg (0-45).", "err");
    playError();
    return;
  }
  const passenger = data.passengers[state.currentPassenger];
  const tag = generateBagTag();
  passenger.bags.push({ tag, weight: w });
  saveData();
  printLine(`Bag tag ${tag} created for ${passenger.name} (${w.toFixed(1)} kg). Printing tag...`, "sys");
  playPrintSound(10);
  printBagTag(passenger, w, tag);
  state.mode = "idle";
  updatePrompt();
}

/* ---------------- PTPS ---------------- */
function doPtps(){
  if(!state.currentPassenger || !data.passengers[state.currentPassenger]){
    printLine("No active passenger. Scan a check-in barcode first.", "err");
    playError();
    return;
  }
  const passenger = data.passengers[state.currentPassenger];
  if(!passenger.boardingPassCode){
    passenger.boardingPassCode = generateUniqueNumber();
    saveData();
  }
  printLine(`Printing boarding pass for ${passenger.name} — seat ${passenger.seat || "UNASSIGNED"}...`, "sys");
  playPrintSound(14);
  const flight = data.flights[passenger.flightNumber];
  printBoardingPass(passenger, flight);
}

/* ---------------- BRD flow ---------------- */
function startBoarding(){
  const keys = Object.keys(data.flights);
  if(keys.length === 0){
    printLine("No flights scheduled yet.", "err");
    playError();
    return;
  }
  state.mode = "brd_flight";
  printRule();
  printLine("BOARD A FLIGHT", "amber");
  keys.forEach(fn=>{
    const f = data.flights[fn];
    printLine(`  ${fn}  ${f.airlineName}  ->  ${f.destCode} ${f.destName}`, "sys");
  });
  printLine("Enter the flight number to board:", "amber");
  updatePrompt();
}
function handleBrdFlight(val){
  const fn = val.trim().toUpperCase();
  const flight = data.flights[fn];
  if(!flight){
    printLine(`No flight found with number "${val}".`, "err");
    playError();
    return;
  }
  state.boardingFlight = fn;
  state.mode = "boarding";
  printRule();
  printLine(`BOARDING MODE — Flight ${fn} to ${flight.destCode} ${flight.destName}`, "amber");
  printLine("Scan boarding passes now. Type BRD COMPLETE when finished.", "sys");
  updatePrompt();
}
function handleBoarding(val){
  const normalized = val.toLowerCase().replace(/\s+/g," ").trim();
  if(normalized === "brd complete" || normalized === "complete" || normalized === "brdcomplete"){
    finishBoarding();
    return;
  }
  if(/^\d{10}$/.test(val)){
    const match = Object.values(data.passengers).find(p => p.boardingPassCode === val);
    if(!match){
      printLine(`No boarding pass found matching ${val}.`, "err");
      playError();
      return;
    }
    if(match.flightNumber !== state.boardingFlight){
      printLine(`WRONG FLIGHT: boarding pass is for flight ${match.flightNumber}, not ${state.boardingFlight}.`, "err");
      playError();
      return;
    }
    if(match.boarded){
      printLine(`Already boarded: ${match.name}`, "dim");
      playError();
      return;
    }
    match.boarded = true;
    saveData();
    playScanBeep();
    printLine(`Boarded: ${match.name}  Flight ${match.flightNumber}  Seat ${match.seat || "N/A"}`, "sys");
    return;
  }
  printLine("Invalid input during boarding. Scan boarding pass or type BRD COMPLETE.", "err");
  playError();
}
function finishBoarding(){
  const fn = state.boardingFlight;
  const flight = data.flights[fn];
  const noShows = flight.passengerCodes
    .map(c => data.passengers[c])
    .filter(p => p && p.boardingPassCode && !p.boarded);

  printRule();
  if(noShows.length === 0){
    printLine(`Boarding complete for flight ${fn}. All passengers boarded.`, "amber");
  } else {
    printLine(`Boarding complete for flight ${fn}. No-shows:`, "amber");
    noShows.forEach(p=> printLine(`  ${p.name}  Seat ${p.seat || "N/A"}`, "err"));
  }

  const boardedCodes = flight.passengerCodes.filter(c => data.passengers[c] && data.passengers[c].boarded);
  boardedCodes.forEach(c => delete data.passengers[c]);
  flight.passengerCodes = flight.passengerCodes.filter(c => !boardedCodes.includes(c));
  saveData();

  printRule();
  state.mode = "idle";
  state.boardingFlight = null;
  if(state.currentPassenger && !data.passengers[state.currentPassenger]) state.currentPassenger = null;
  updatePrompt();
}

/* ---------------- check-in scan ---------------- */
function scanCheckin(code){
  const passenger = data.passengers[code];
  if(!passenger){
    printLine(`No passenger found for barcode ${code}.`, "err");
    playError();
    return;
  }
  playScanBeep();
  passenger.checkedIn = true;
  state.currentPassenger = code;
  saveData();
  printRule();
  printLine(`Checked in: ${passenger.name}`, "amber");
  printLine(`Flight ${passenger.flightNumber}  ->  ${passenger.destCode} | Seat: ${passenger.seat || "N/A"}`, "sys");
  printLine(`Address on file: ${passenger.address || 'N/A'}`, "sys");
  printLine("Type ADDBG to add a bag, or PTPS to print boarding pass.", "dim");
  printRule();
  updatePrompt();
}

/* ---------------- main command parser ---------------- */
function handleInput(raw){
  const val = raw.trim();
  if(val === "") return;
  echoInput(val);

  if(state.mode === "schdl_dest"){ handleSchdlDest(val); return; }
  if(state.mode === "schdl_aircraft"){ handleSchdlAircraft(val); return; }
  if(state.mode === "schdl_count"){ handleSchdlCount(val); return; }
  if(state.mode === "manual_dest"){ handleManualDest(val); return; }
  if(state.mode === "manual_count"){ handleManualCount(val); return; }
  if(state.mode === "manual_names"){ handleManualNames(val); return; }
  if(state.mode === "manual_address"){ handleManualAddress(val); return; }
  if(state.mode === "addbg_weight"){ handleAddbgWeight(val); return; }
  if(state.mode === "brd_flight"){ handleBrdFlight(val); return; }
  if(state.mode === "boarding"){ handleBoarding(val); return; }

  const cmd = val.toLowerCase();
  if(cmd === "help"){ showHelp(); return; }
  if(cmd === "printer"){ connectMunbynPrinter(); return; }
  if(cmd === "clear"){ clearScreen(); return; }
  if(cmd === "mode"){ toggleMode(); return; }
  if(cmd === "schdlflight"){ startSchdlFlight(); return; }
  if(cmd === "schdl"){
    if(manualCustomerMode){ startManualBooking(); }
    else { startSchdlFlight(); }
    return;
  }
  if(cmd === "addbg"){ startAddbg(); return; }
  if(cmd === "ptps"){ doPtps(); return; }
  if(cmd === "brd"){ startBoarding(); return; }
  if(cmd === "flights"){ showFlights(); return; }
  if(/^\d{10}$/.test(val)){ scanCheckin(val); return; }

  printLine(`Unrecognized command: "${val}". Type HELP for options.`, "err");
  playError();
}

/* ---------------- input wiring ---------------- */
inputEl.addEventListener("keydown", (e)=>{
  if(e.key === "Enter"){
    const v = inputEl.value;
    inputEl.value = "";
    handleInput(v);
    updatePrompt();
  } else if(e.key.length === 1){
    playKeyClick();
  }
});
document.getElementById("screen").addEventListener("click", ()=> inputEl.focus());
window.addEventListener("focus", ()=> inputEl.focus());
inputEl.focus();

/* ---------------- clock ---------------- */
function tickClock(){
  document.getElementById("clock").textContent = new Date().toLocaleTimeString([], {hour12:false});
}
setInterval(tickClock, 1000);
tickClock();

/* =========================================================
   PRINTING — Individual customer check-in slips with cuts
   ========================================================= */
async function openPrintWindow(title, bodyHtml, scriptBody, textLinesForEscPos, barcodesArray){
  if(!forcePopupPrintMode && directPrintEnabled && textLinesForEscPos) {
    const rawBytes = buildEscPosText(textLinesForEscPos, barcodesArray || []);
    const success = await sendRawToPrinter(rawBytes);
    if(success) {
      printLine(`[MUNBYN POS-80] Printed ${title} directly!`, "sys");
      return;
    }
  }

  const w = window.open("", "_blank", "width=420,height=680");
  if(!w){
    printLine("Popup window was blocked by browser. Allow popups to print tickets.", "err");
    return null;
  }
  const html = `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>${title}</title>
<style>
  @page { size: 80mm auto; margin: 1mm 2mm; }
  * { box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    width:76mm; font-family:'Courier New', Courier, monospace;
    color:#000; font-size:14px; line-height:1.2; font-weight:700;
    background:#fff;
  }
  .center{ text-align:center; }
  .bold{ font-weight:900; }
  .big{ font-size:18px; }
  .hr{ border-top:2px dashed #000; margin:2mm 0; }
  .row{ display:flex; justify-content:space-between; gap:2mm; font-size:13px; margin:1mm 0; }
  .row span:last-child{ text-align:right; }
  canvas{ max-width:100%; height:auto; display:inline-block; }
  .code{ font-size:14px; letter-spacing:1px; margin-top:1mm; font-weight:900; }
  .slip-box { border: 2px solid #000; padding: 3mm; margin-bottom: 4mm; page-break-after: always; }
</style>
</head>
<body>
${bodyHtml}
<script src="https://cdn.jsdelivr.net/npm/bwip-js@4.10.0/dist/bwip-js-min.js"><\/script>
<script>
window.onload = function() {
  try {
    ${scriptBody}
  } catch(err) {
    console.error("Barcode generation error:", err);
  }
  setTimeout(function(){ window.print(); }, 250);
};
<\/script>
</body></html>`;
  w.document.open();
  w.document.write(html);
  w.document.close();
  setTimeout(()=> inputEl.focus(), 400);
  return w;
}

/* Print individual customer check-in slips with cuts between passengers */
function printManualCustomerSlips(flight, passengers, address){
  let bodyHtml = "";
  let scriptBody = "";
  let escLines = [];
  let allBarcodes = [];

  passengers.forEach((p, index) => {
    bodyHtml += `
    <div class="slip-box">
      <div class="center bold big">SKYTERM RESERVATION SLIP</div>
      <div class="center" style="font-size:11px;">CUSTOMER PHONE BOOKING // DAILY RUN</div>
      <div class="hr"></div>
      <div style="font-size:13px;">PASSENGER: ${escapeHtml(p.name)}</div>
      <div style="font-size:12px;">ADDRESS: ${escapeHtml(address)}</div>
      <div class="hr"></div>
      <div class="row"><span>FLIGHT:</span><span>${flight.flightNumber} (${flight.airlineName})</span></div>
      <div class="row"><span>DESTINATION:</span><span>${flight.destCode} - ${flight.destName}</span></div>
      <div class="row"><span>SEAT ASSIGN:</span><span>${p.seat || 'UNASSIGNED'}</span></div>
      <div class="row"><span>BOOKED DATE:</span><span>${todayString()}</span></div>
      <div class="hr"></div>
      <div class="center" style="margin-top:2mm;"><canvas id="slipbc_${index}"></canvas></div>
      <div class="center code">${p.checkinCode}</div>
      <div class="center" style="font-size:10px; margin-top:1mm;">CHECK-IN BARCODE (PRESENT AT COUNTER)</div>
    </div>
    `;

    scriptBody += `
    try {
      bwipjs.toCanvas('slipbc_${index}', { bcid:'code128', text:'${p.checkinCode}', scale:2, height:14, includetext:false });
    } catch(e) {}
    `;

    allBarcodes.push(p.checkinCode);
  });

  // For ESC/POS raw hardware printing, build lines
  passengers.forEach((p) => {
    escLines.push(
      { text: `SKYTERM RESERVATION SLIP`, bold: true, size: 'big' },
      { text: `PASSENGER: ${p.name}`, bold: true, size: 'med' },
      { text: `ADDRESS: ${address}`, bold: false, size: 'normal' },
      { text: `FLT: ${flight.flightNumber} | DEST: ${flight.destCode}`, bold: true, size: 'normal' },
      { text: `SEAT: ${p.seat || 'UNASSIGNED'}`, bold: false, size: 'normal' },
      { text: `--------------------------------`, bold: false, size: 'normal' }
    );
  });

  playPrintSound(passengers.length * 12);
  openPrintWindow(`Reservation Slips (${passengers.length})`, bodyHtml, scriptBody, escLines, allBarcodes);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}
