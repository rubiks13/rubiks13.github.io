<script>
/* =========================================================
   SKYTERM — fictional airport departure control terminal
   Single-file HTML/CSS/JS. Barcodes rendered via bwip-js
   (loaded on demand inside print windows or sent directly via ESC/POS).
   ========================================================= */

const BWIP_URL = "https://cdnjs.cloudflare.com/ajax/libs/bwip-js/4.10.0/bwip-js-min.js";
const ORIGIN = {code:"HUB", name:"Home Terminal"};
const AIRLINES = [
  {code:"ST", name:"SkyTerm Air"},
  {code:"NV", name:"Nova Airlines"},
  {code:"PW", name:"Pacific Wing"}
];
const DESTINATIONS = [
  {code:"JFK", name:"New York, USA"},
  {code:"LAX", name:"Los Angeles, USA"},
  {code:"ORD", name:"Chicago, USA"},
  {code:"LHR", name:"London, UK"},
  {code:"CDG", name:"Paris, France"},
  {code:"FRA", name:"Frankfurt, Germany"},
  {code:"DXB", name:"Dubai, UAE"},
  {code:"SIN", name:"Singapore"},
  {code:"NRT", name:"Tokyo (Narita), Japan"},
  {code:"SYD", name:"Sydney, Australia"}
];
const AIRCRAFT = [
  {code:"737", name:"Boeing 737-800", capacity:32},
  {code:"777", name:"Boeing 777-300", capacity:40},
  {code:"787", name:"Boeing 787-9",  capacity:36},
  {code:"320", name:"Airbus A320",   capacity:30},
  {code:"350", name:"Airbus A350",   capacity:40}
];
const FIRST_NAMES = ["James","Mary","Robert","Patricia","John","Jennifer","Michael","Linda","David","Elizabeth",
  "William","Barbara","Richard","Susan","Joseph","Jessica","Thomas","Sarah","Charles","Karen",
  "Daniel","Nancy","Matthew","Lisa","Anthony","Margaret","Mark","Sandra","Paul","Ashley",
  "Kevin","Emily","Brian","Kimberly","George","Donna","Edward","Michelle","Ronald","Carol"];
const LAST_NAMES = ["Smith","Johnson","Williams","Brown","Jones","Garcia","Miller","Davis","Rodriguez","Martinez",
  "Hernandez","Lopez","Wilson","Anderson","Thomas","Taylor","Moore","Jackson","Martin","Lee",
  "Perez","Thompson","White","Harris","Sanchez","Clark","Ramirez","Lewis","Robinson","Walker",
  "Young","Allen","King","Wright","Scott","Torres","Nguyen","Hill","Flores","Green"];

/* ---------------- printer bridge state ---------------- */
let usbPrinterDevice = null;
let printerInterfaceNumber = null;
let printerEndpointOut = null;
let directPrintEnabled = false;

async function connectMunbynPrinter() {
  if (!navigator.usb) {
    printLine("WebUSB is not supported in this browser. Use Chrome/Edge over HTTPS.", "err");
    playError();
    return;
  }
  try {
    // MUNBYN POS-80 or standard USB receipt printers typically use printer class (class 7)
    // Or we can prompt for any device and let the user pick.
    usbPrinterDevice = await navigator.usb.requestDevice({
      filters: [
        { classCode: 7 }, // Printer device class
        { vendorId: 0x0483 }, // Common STMicroelectronics / thermal printer chipsets
        { vendorId: 0x0416 }, // Winbond / Posiflex / Munbyn chipsets
        { vendorId: 0x6868 }, // Often used by thermal printers
        { vendorId: 0x0493 }  // Compucorp/other POS
      ]
    });
    
    await usbPrinterDevice.open();
    if (usbPrinterDevice.configuration === null) {
      await usbPrinterDevice.selectConfiguration(1);
    }
    
    // Find interface and endpoint for output
    let found = false;
    for (const conf of usbPrinterDevice.configurations) {
      for (const intf of conf.interfaces) {
        for (const alt of intf.alternate.endpoints) {
          if (alt.direction === 'out') {
            printerInterfaceNumber = intf.interfaceNumber;
            printerEndpointOut = alt.endpointNumber;
            found = true;
            break;
          }
        }
        if (found) break;
      }
      if (found) break;
    }

    if (!printerInterfaceNumber && usbPrinterDevice.configurations[0].interfaces[0]) {
      printerInterfaceNumber = usbPrinterDevice.configurations[0].interfaces[0].interfaceNumber;
      printerEndpointOut = 1; // Fallback default endpoint
    }

    await usbPrinterDevice.claimInterface(printerInterfaceNumber);
    directPrintEnabled = true;
    printLine(`MUNBYN POS-80 Printer connected successfully via USB! (${usbPrinterDevice.productName || 'Thermal Printer'})`, "amber");
    playConfirm();
  } catch (err) {
    printLine(`Printer connection cancelled or failed: ${err.message}`, "err");
    playError();
  }
}

async function sendRawToPrinter(uint8Array) {
  if (!directPrintEnabled || !usbPrinterDevice) {
    return false; // Fallback to popup window printing
  }
  try {
    await usbPrinterDevice.transferOut(printerEndpointOut, uint8Array);
    // Send cutter command ESC m or GS V
    const cutterCmd = new Uint8Array([0x1D, 0x56, 0x42, 0x00]); // Partial cut
    await usbPrinterDevice.transferOut(printerEndpointOut, cutterCmd);
    return true;
  } catch (err) {
    printLine(`Direct print transmission error: ${err.message}`, "err");
    directPrintEnabled = false;
    return false;
  }
}

/* Helper to build simple ESC/POS byte commands for MUNBYN POS-80 */
function buildEscPosText(textLines) {
  let bytes = [];
  // Initialize printer ESC @
  bytes.push(0x1B, 0x40);
  // Center alignment default
  bytes.push(0x1B, 0x61, 0x01);

  for (let line of textLines) {
    if (line.bold) {
      bytes.push(0x1B, 0x45, 0x01); // Bold on
    } else {
      bytes.push(0x1B, 0x45, 0x00); // Bold off
    }
    if (line.size === 'big') {
      bytes.push(0x1D, 0x21, 0x11); // Double width & height
    } else if (line.size === 'med') {
      bytes.push(0x1D, 0x21, 0x01); // Double height
    } else {
      bytes.push(0x1D, 0x21, 0x00); // Normal
    }
    
    // Encode text to ASCII/CP437
    for (let i = 0; i < line.text.length; i++) {
      bytes.push(line.text.charCodeAt(i) & 0xFF);
    }
    bytes.push(0x0A); // Newline
  }

  // Feed and cut
  bytes.push(0x0A, 0x0A, 0x0A);
  bytes.push(0x1D, 0x56, 0x41, 0x03); // Full cut
  return new Uint8Array(bytes);
}

/* ---------------- storage ---------------- */
const STORE_KEY = "skyterm_data_v1";
let data = loadData();

function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { flights:{}, passengers:{}, usedNumbers:{}, usedFlightNumbers:{} };
}
function saveData(){
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
}

/* ---------------- helpers ---------------- */
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[randInt(0,arr.length-1)]; }

function randomDigits(n){
  let s = "";
  for(let i=0;i<n;i++) s += randInt(0,9);
  return s;
}
function generateUniqueNumber(){
  let n;
  do { n = randomDigits(10); } while(data.usedNumbers[n]);
  data.usedNumbers[n] = true;
  return n;
}
function generateBagTag(){
  let n;
  do { n = "BG" + randomDigits(6); } while(data.usedNumbers[n]);
  data.usedNumbers[n] = true;
  return n;
}
function generateFlightNumber(){
  const airline = pick(AIRLINES);
  let num;
  do { num = airline.code + randInt(100,999); } while(data.usedFlightNumbers[num]);
  data.usedFlightNumbers[num] = true;
  return { flightNumber:num, airlineName:airline.name };
}
function randomName(){
  return pick(FIRST_NAMES) + " " + pick(LAST_NAMES);
}
function randomSeat(usedSeats, capacity){
  const rows = Math.ceil(capacity/6);
  const letters = ["A","B","C","D","E","F"];
  let attempts = 0;
  while(attempts < 500){
    const s = randInt(1,rows) + pick(letters);
    if(!usedSeats.has(s)){ usedSeats.add(s); return s; }
    attempts++;
  }
  return null;
}
function nowTimeString(offsetMinutes=0){
  const d = new Date(Date.now() + offsetMinutes*60000);
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12:false});
}
function todayString(){
  const d = new Date();
  return d.toLocaleDateString();
}

/* ---------------- audio ---------------- */
let audioCtx = null;
function ctx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  return audioCtx;
}
function beep(freq, duration, type, vol){
  const ac = ctx();
  if(!ac) return;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = type || "square";
  osc.frequency.value = freq;
  gain.gain.value = vol!==undefined ? vol : 0.04;
  osc.connect(gain); gain.connect(ac.destination);
  const t = ac.currentTime;
  gain.gain.setValueAtTime(gain.gain.value, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + duration/1000);
  osc.start(t);
  osc.stop(t + duration/1000 + 0.02);
}
function playKeyClick(){ beep(randInt(700,1100), 12, "square", 0.02); }
function playScanBeep(){ beep(1900, 90, "square", 0.05); setTimeout(()=>beep(2300,70,"square",0.05), 100); }
function playError(){ beep(160, 220, "sawtooth", 0.05); }
function playConfirm(){ beep(880, 60, "sine", 0.04); setTimeout(()=>beep(1320,70,"sine",0.04),70); }
function playPrintSound(ticks){
  const n = ticks || 22;
  for(let i=0;i<n;i++){
    setTimeout(()=>beep(180+randInt(0,140), 18, "square", 0.025), i*45);
  }
}

/* ---------------- terminal I/O ---------------- */
const outputEl = document.getElementById("output");
const inputEl = document.getElementById("cmdInput");
const promptLabel = document.getElementById("promptLabel");

function printLine(text, cls){
  const div = document.createElement("div");
  div.className = "line " + (cls||"sys");
  div.textContent = text;
  outputEl.appendChild(div);
  outputEl.scrollTop = outputEl.scrollHeight;
}
function printBlock(text, cls){
  text.split("\n").forEach(l => printLine(l, cls));
}
function printRule(){
  printLine("------------------------------------------------------------", "rule");
}
function clearScreen(){
  outputEl.innerHTML = "";
}
function echoInput(val){
  printLine(promptLabel.textContent + " " + val, "echo");
}

/* ---------------- state machine ---------------- */
const state = {
  mode: "idle",       // idle | schdl_dest | schdl_aircraft | schdl_count | addbg_weight | brd_flight | boarding
  currentPassenger: null, // checkin code
  boardingFlight: null,   // flight number currently being boarded
  schdl: {}
};

function updatePrompt(){
  if(state.mode === "boarding"){ promptLabel.textContent = "BOARD[" + state.boardingFlight + "]>"; return; }
  if(state.mode === "brd_flight"){ promptLabel.textContent = "BOARD>"; return; }
  if(state.mode.startsWith("schdl")){ promptLabel.textContent = "SCHDL>"; return; }
  if(state.mode === "addbg_weight"){ promptLabel.textContent = "BAG>"; return; }
  if(state.currentPassenger && data.passengers[state.currentPassenger]){
    const p = data.passengers[state.currentPassenger];
    const shortName = p.name.split(" ")[1] || p.name;
    promptLabel.textContent = "SKYTERM[" + shortName.toUpperCase() + "]>";
  } else {
    promptLabel.textContent = "SKYTERM>";
  }
}

/* ---------------- boot ---------------- */
function boot(){
  printBlock(
`SKYTERM DEPARTURE CONTROL SYSTEM — v3.1 (MUNBYN POS-80 Direct Link Ready)
(c) fictional airline systems, for simulation & training use only
Terminal ready.

Type HELP for a list of commands, or PRINTER to connect your MUNBYN POS-80.`, "amber");
  printRule();
  updatePrompt();
}

/* ---------------- help ---------------- */
function showHelp(){
  printBlock(
`AVAILABLE COMMANDS
  PRINTER        connect MUNBYN POS-80 thermal printer via WebUSB
  HELP           show this list
  SCHDL          schedule a new flight (destination / aircraft / pax count)
  [scan barcode] type or scan a 10-digit check-in number to check a
                 passenger in (this also selects them as the active
                 passenger for ADDBG / PTPS)
  ADDBG          add a bag for the active (checked-in) passenger
  PTPS           print boarding pass for the active passenger
  BRD            board a flight (asks which flight number first, then
                 scan boarding passes at the gate)
  BRD COMPLETE   exit boarding mode, list any no-shows, and clear the
                 boarded passengers from storage
  FLIGHTS        list scheduled flights
  CLEAR          clear the screen`, "sys");
}

function showFlights(){
  const keys = Object.keys(data.flights);
  if(keys.length===0){ printLine("No flights scheduled yet. Type SCHDL to create one.", "dim"); return; }
  printLine("SCHEDULED FLIGHTS", "amber");
  keys.forEach(fn=>{
    const f = data.flights[fn];
    const total = f.passengerCodes.length;
    const checkedIn = f.passengerCodes.filter(c=>data.passengers[c].checkedIn).length;
    const boarded = f.passengerCodes.filter(c=>data.passengers[c].boarded).length;
    printLine(`  ${fn}  ${f.airlineName}  ->  ${f.destCode} ${f.destName}  |  ${f.aircraftName}  |  pax ${checkedIn}/${total} checked-in, ${boarded} boarded`, "sys");
  });
}

/* ---------------- SCHDL flow ---------------- */
function startSchdl(){
  state.mode = "schdl_dest";
  state.schdl = {};
  printLine("SCHEDULE NEW FLIGHT", "amber");
  printLine("Select destination:", "sys");
  DESTINATIONS.forEach((d,i)=> printLine(`  ${i+1}) ${d.code}  ${d.name}`, "sys"));
  printLine("Enter destination code or number:", "amber");
  updatePrompt();
}
function handleSchdlDest(val){
  const idx = parseInt(val,10);
  let dest = null;
  if(!isNaN(idx) && DESTINATIONS[idx-1]) dest = DESTINATIONS[idx-1];
  else dest = DESTINATIONS.find(d=>d.code.toLowerCase() === val.toLowerCase());
  if(!dest){
    printLine(`Unrecognized destination "${val}". Try a code like LAX, or a number 1-10.`, "err");
    playError();
    return;
  }
  state.schdl.dest = dest;
  state.mode = "schdl_aircraft";
  printLine(`Destination set: ${dest.code} - ${dest.name}`, "sys");
  printLine("Select aircraft type:", "sys");
  AIRCRAFT.forEach((a,i)=> printLine(`  ${i+1}) ${a.code}  ${a.name}  (capacity ${a.capacity})`, "sys"));
  printLine("Enter aircraft number or code:", "amber");
  updatePrompt();
}
function handleSchdlAircraft(val){
  const idx = parseInt(val,10);
  let ac = null;
  if(!isNaN(idx) && AIRCRAFT[idx-1]) ac = AIRCRAFT[idx-1];
  else ac = AIRCRAFT.find(a=>a.code.toLowerCase() === val.toLowerCase());
  if(!ac){
    printLine(`Unrecognized aircraft "${val}". Try a code like 737, or a number 1-5.`, "err");
    playError();
    return;
  }
  state.schdl.aircraft = ac;
  state.mode = "schdl_count";
  printLine(`Aircraft set: ${ac.name}`, "sys");
  printLine(`Enter number of passengers for this flight (1-${ac.capacity}):`, "amber");
  updatePrompt();
}
function handleSchdlCount(val){
  const n = parseInt(val,10);
  const cap = state.schdl.aircraft.capacity;
  if(isNaN(n) || n < 1 || n > cap){
    printLine(`Enter a number between 1 and ${cap}.`, "err");
    playError();
    return;
  }
  createFlight(state.schdl.dest, state.schdl.aircraft, n);
  state.mode = "idle";
  state.schdl = {};
  updatePrompt();
}

function createFlight(dest, aircraft, count){
  const {flightNumber, airlineName} = generateFlightNumber();
  const flight = {
    flightNumber, airlineName,
    destCode: dest.code, destName: dest.name,
    aircraftCode: aircraft.code, aircraftName: aircraft.name,
    createdAt: new Date().toISOString(),
    passengerCodes: []
  };
  const usedSeats = new Set();
  const passengers = [];
  for(let i=0;i<count;i++){
    const checkinCode = generateUniqueNumber();
    const assignSeat = Math.random() < 0.75;
    const seat = assignSeat ? randomSeat(usedSeats, aircraft.capacity) : null;
    const passenger = {
      checkinCode, name: randomName(),
      flightNumber, destCode: dest.code,
      seat, checkedIn:false, bags:[],
      boardingPassCode:null, boarded:false
    };
    data.passengers[checkinCode] = passenger;
    flight.passengerCodes.push(checkinCode);
    passengers.push(passenger);
  }
  data.flights[flightNumber] = flight;
  saveData();

  printRule();
  printLine(`Creating flight ${flightNumber} (${airlineName}) -> ${dest.code} ${dest.name}`, "amber");
  printLine(`Aircraft: ${aircraft.name}   Passengers: ${count}`, "sys");
  printLine("Sending manifest barcodes to printer...", "sys");
  printRule();

  playPrintSound(count*2);
  printManifestBarcodes(flight, passengers);
}

/* ---------------- ADDBG flow ---------------- */
function startAddbg(){
  if(!state.currentPassenger || !data.passengers[state.currentPassenger]){
    printLine("No active passenger. Scan a check-in barcode first.", "err");
    playError();
    return;
  }
  state.mode = "addbg_weight";
  printLine("Enter bag weight in kg:", "amber");
  updatePrompt();
}
function handleAddbgWeight(val){
  const w = parseFloat(val);
  if(isNaN(w) || w <= 0 || w > 45){
    printLine("Enter a valid weight in kg (0-45).", "err");
    playError();
    return;
  }
  const passenger = data.passengers[state.currentPassenger];
  const tag = generateBagTag();
  passenger.bags.push({ tag, weight: w });
  saveData();
  printLine(`Bag tag ${tag} created for ${passenger.name} (${w.toFixed(1)} kg). Printing tag...`, "sys");
  playPrintSound(10);
  printBagTag(passenger, w, tag);
  state.mode = "idle";
  updatePrompt();
}

/* ---------------- PTPS ---------------- */
function doPtps(){
  if(!state.currentPassenger || !data.passengers[state.currentPassenger]){
    printLine("No active passenger. Scan a check-in barcode first.", "err");
    playError();
    return;
  }
  const passenger = data.passengers[state.currentPassenger];
  if(!passenger.boardingPassCode){
    passenger.boardingPassCode = generateUniqueNumber();
    saveData();
  }
  printLine(`Printing boarding pass for ${passenger.name} — seat ${passenger.seat || "UNASSIGNED"}...`, "sys");
  playPrintSound(14);
  const flight = data.flights[passenger.flightNumber];
  printBoardingPass(passenger, flight);
}

/* ---------------- BRD flow ---------------- */
function startBoarding(){
  const keys = Object.keys(data.flights);
  if(keys.length === 0){
    printLine("No flights scheduled yet. Type SCHDL to create one first.", "err");
    playError();
    return;
  }
  state.mode = "brd_flight";
  printRule();
  printLine("BOARD A FLIGHT", "amber");
  keys.forEach(fn=>{
    const f = data.flights[fn];
    printLine(`  ${fn}  ${f.airlineName}  ->  ${f.destCode} ${f.destName}`, "sys");
  });
  printLine("Enter the flight number to board:", "amber");
  updatePrompt();
}
function handleBrdFlight(val){
  const fn = val.trim().toUpperCase();
  const flight = data.flights[fn];
  if(!flight){
    printLine(`No flight found with number "${val}". Enter one of the flight numbers listed above.`, "err");
    playError();
    return;
  }
  state.boardingFlight = fn;
  state.mode = "boarding";
  printRule();
  printLine(`BOARDING MODE — Flight ${fn} to ${flight.destCode} ${flight.destName}`, "amber");
  printLine("Scan boarding passes now. Type BRD COMPLETE when finished.", "sys");
  updatePrompt();
}
function handleBoarding(val){
  const normalized = val.toLowerCase().replace(/\s+/g," ").trim();
  if(normalized === "brd complete" || normalized === "complete" || normalized === "brdcomplete"){
    finishBoarding();
    return;
  }
  if(/^\d{10}$/.test(val)){
    const match = Object.values(data.passengers).find(p => p.boardingPassCode === val);
    if(!match){
      printLine(`No boarding pass found matching ${val}.`, "err");
      playError();
      return;
    }
    if(match.flightNumber !== state.boardingFlight){
      printLine(`WRONG FLIGHT: that boarding pass is for flight ${match.flightNumber}, not ${state.boardingFlight}.`, "err");
      playError();
      return;
    }
    if(match.boarded){
      printLine(`Already boarded: ${match.name} (seat ${match.seat||"N/A"})`, "dim");
      playError();
      return;
    }
    match.boarded = true;
    saveData();
    playScanBeep();
    printLine(`Boarded: ${match.name}  Flight ${match.flightNumber}  Seat ${match.seat || "N/A"}`, "sys");
    return;
  }
  printLine("Invalid input during boarding. Scan a boarding pass or type BRD COMPLETE.", "err");
  playError();
}
function finishBoarding(){
  const fn = state.boardingFlight;
  const flight = data.flights[fn];
  const noShows = flight.passengerCodes
    .map(c => data.passengers[c])
    .filter(p => p && p.boardingPassCode && !p.boarded);

  printRule();
  if(noShows.length === 0){
    printLine(`Boarding complete for flight ${fn}. All passengers with printed boarding passes have boarded.`, "amber");
  } else {
    printLine(`Boarding complete for flight ${fn}. The following passengers have NOT boarded:`, "amber");
    noShows.forEach(p=>{
      printLine(`  ${p.name}  Seat ${p.seat || "N/A"}`, "err");
    });
  }

  // Clear out data for anyone who has boarded — no longer needed.
  const boardedCodes = flight.passengerCodes.filter(c => data.passengers[c] && data.passengers[c].boarded);
  boardedCodes.forEach(c => delete data.passengers[c]);
  flight.passengerCodes = flight.passengerCodes.filter(c => !boardedCodes.includes(c));
  saveData();

  printRule();
  state.mode = "idle";
  state.boardingFlight = null;
  if(state.currentPassenger && !data.passengers[state.currentPassenger]) state.currentPassenger = null;
  updatePrompt();
}

/* ---------------- check-in scan ---------------- */
function scanCheckin(code){
  const passenger = data.passengers[code];
  if(!passenger){
    printLine(`No passenger found for barcode ${code}.`, "err");
    playError();
    return;
  }
  playScanBeep();
  passenger.checkedIn = true;
  state.currentPassenger = code;
  saveData();
  printRule();
  printLine(`Checked in: ${passenger.name}`, "amber");
  printLine(`Flight ${passenger.flightNumber}  ->  ${passenger.destCode}`, "sys");
  printLine(`Seat: ${passenger.seat || "NO SEAT ASSIGNED - assign at gate"}`, "sys");
  printLine(`Bags on file: ${passenger.bags.length}`, "sys");
  printLine("Type ADDBG to add a bag, or PTPS to print a boarding pass.", "dim");
  printRule();
  updatePrompt();
}

/* ---------------- main command parser ---------------- */
function handleInput(raw){
  const val = raw.trim();
  if(val === "") return;
  echoInput(val);

  if(state.mode === "schdl_dest"){ handleSchdlDest(val); return; }
  if(state.mode === "schdl_aircraft"){ handleSchdlAircraft(val); return; }
  if(state.mode === "schdl_count"){ handleSchdlCount(val); return; }
  if(state.mode === "addbg_weight"){ handleAddbgWeight(val); return; }
  if(state.mode === "brd_flight"){ handleBrdFlight(val); return; }
  if(state.mode === "boarding"){ handleBoarding(val); return; }

  const cmd = val.toLowerCase();
  if(cmd === "help"){ showHelp(); return; }
  if(cmd === "printer"){ connectMunbynPrinter(); return; }
  if(cmd === "clear"){ clearScreen(); return; }
  if(cmd === "schdl"){ startSchdl(); return; }
  if(cmd === "addbg"){ startAddbg(); return; }
  if(cmd === "ptps"){ doPtps(); return; }
  if(cmd === "brd"){ startBoarding(); return; }
  if(cmd === "flights"){ showFlights(); return; }
  if(/^\d{10}$/.test(val)){ scanCheckin(val); return; }

  printLine(`Unrecognized command: "${val}". Type HELP for a list of commands.`, "err");
  playError();
}

/* ---------------- input wiring ---------------- */
inputEl.addEventListener("keydown", (e)=>{
  if(e.key === "Enter"){
    const v = inputEl.value;
    inputEl.value = "";
    handleInput(v);
    updatePrompt();
  } else if(e.key.length === 1){
    playKeyClick();
  }
});
document.getElementById("screen").addEventListener("click", ()=> inputEl.focus());
window.addEventListener("focus", ()=> inputEl.focus());
inputEl.focus();

/* ---------------- clock ---------------- */
function tickClock(){
  document.getElementById("clock").textContent = new Date().toLocaleTimeString([], {hour12:false});
}
setInterval(tickClock, 1000);
tickClock();

/* =========================================================
   PRINTING — supports direct WebUSB ESC/POS (MUNBYN POS-80) 
   with fallback popup window for standard system printers.
   ========================================================= */
async function openPrintWindow(title, bodyHtml, scriptBody, textLinesForEscPos){
  // Try direct ESC/POS printing first if MUNBYN POS-80 is connected
  if(directPrintEnabled && textLinesForEscPos) {
    const rawBytes = buildEscPosText(textLinesForEscPos);
    const success = await sendRawToPrinter(rawBytes);
    if(success) {
      printLine(`[MUNBYN POS-80] Printed ${title} directly!`, "sys");
      return;
    }
  }

  // Fallback to browser print window popup
  const w = window.open("", "_blank", "width=420,height=640");
  if(!w){
    printLine("Popup blocked — please allow popups for this page to print, or type PRINTER to connect WebUSB.", "err");
    return null;
  }
  const html = `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>${title}</title>
<style>
  @page { size: 80mm auto; margin: 2mm; }
  * { box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    width:76mm; font-family:Arial, Helvetica, sans-serif;
    color:#000; font-size:16px; line-height:1.35; font-weight:700;
    -webkit-font-smoothing:none;
  }
  .center{ text-align:center; }
  .bold{ font-weight:900; }
  .big{ font-size:22px; letter-spacing:0.5px; }
  .hr{ border-top:3px solid #000; margin:3mm 0; }
  .row{ display:flex; justify-content:space-between; gap:4mm; font-size:16px; margin:1mm 0; }
  .row span:last-child{ text-align:right; }
  .grid{ display:flex; flex-direction:column; }
  .bcgrid{ display:grid; grid-template-columns:1fr 1fr; gap:6mm 4mm; margin-top:2mm; }
  .bccell{ text-align:center; padding: 2mm 0; }
  .tag{ text-align:center; padding:2mm 0 3mm 0; margin-bottom:3mm; border-bottom:3px solid #000; }
  .tag:last-child{ border-bottom:none; }
  canvas{ max-width:100%; image-rendering:pixelated; }
  .small{ font-size:14px; font-weight:700; }
  .code{ font-size:15px; letter-spacing:2px; margin-top:1mm; font-weight:900; }
  .bp-header{
    background:#1a4fa0; color:#fff;
    display:flex; align-items:center; gap:3mm; padding:4mm 3mm 2mm 3mm;
  }
  .bp-plane{ width:9mm; flex:0 0 auto; }
  .bp-plane svg{ width:100%; display:block; }
  .bp-airline{ font-size:20px; font-weight:900; letter-spacing:0.5px; }
  .bp-sub{
    background:#1a4fa0; color:#fff; text-align:center;
    font-size:15px; font-weight:700; letter-spacing:1px;
    padding:0 0 3mm 0; width:100%;
  }
  .bp-body{ padding:3mm 3mm 1mm 3mm; }
  .bp-label{ font-size:11px; color:#333; font-weight:700; margin-top:2mm; }
  .bp-value{ font-size:18px; font-weight:900; }
  .bp-row2{ display:flex; justify-content:space-between; gap:3mm; }
  .bp-row2 > div{ flex:1; }
  .bp-barcode{ text-align:center; padding:2mm 0; }
  .bp-footer{
    background:#1a4fa0; color:#fff; display:flex; flex-direction:column;
    align-items:center; gap:1mm; padding:2mm 3mm 3mm 3mm;
    font-size:12px; font-weight:700; text-align:center; width:100%;
  }
</style>
</head>
<body>
${bodyHtml}
<script src="${BWIP_URL}"><\/script>
<script>
${scriptBody}
window.onafterprint = function(){ window.close(); };
setTimeout(function(){ window.print(); }, 150);
<\/script>
</body></html>`;
  w.document.open();
  w.document.write(html);
  w.document.close();
  setTimeout(()=> inputEl.focus(), 400);
  return w;
}

  const header = `

    }catch(e){ document.getElementById('bc${i}').outerHTML = '${p.checkinCode}'; }

  openPrintWindow(`Manifest ${flight.flightNumber}`, header, script, escLines);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}
