<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiments Navigation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            margin-bottom: 24px;
            font-size: 24px;
            color: #1a202c;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            color: #ffffff;
            background-color: #3182ce;
            border-radius: 8px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .btn:hover {
            background-color: #2b6cb0;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-store {
            background-color: #38a169;
        }
        .btn-store:hover {
            background-color: #2f855a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Experiments Directory</h1>
        <div class="button-group">
            <a href="https://rubiks13.github.io/experiment/airport.html" class="btn">Airport</a>
            <a href="https://rubiks13.github.io/experiment/store.html" class="btn btn-store">Store</a>
            <a href="https://rubiks13.github.io/storage" class="btn btn-store">Clear storage</a>
        </div>
    </div>

</body>
</html>
