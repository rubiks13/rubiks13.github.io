<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Kiosk - Login</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background: repeating-linear-gradient(
                -45deg,
                #FA622E,
                #FA622E 35px,
                #ED7652 35px,
                #ED7652 70px
            );
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Top-left logo card styling matching InDesign spec */
        .kiosk-card-logo {
            background-color: #EE7D60;
            border-bottom-right-radius: 2.5rem;
        }

        /* Center login box background */
        .kiosk-card {
            background-color: #EE7D60;
        }

        /* Black outlined pill input field matching InDesign spec */
        .kiosk-input {
            border: 3px solid #000000;
            outline: none;
            background-color: transparent;
        }

        .kiosk-input:focus {
            box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="relative w-screen h-screen flex flex-col justify-between items-center m-0 p-0">

    <!-- Top-Left Amazon Logo Box -->
    <div class="absolute top-0 left-0 z-10">
        <div class="kiosk-card-logo p-6 sm:p-8 pr-12 pb-8 flex items-center justify-center">
            <!-- Tries local amazon.svg first, falls back gracefully without console errors -->
            <img 
                id="amazonLogo" 
                src="Amazon_Logo_0.svg" 
                alt="Amazon Logo" 
                class="h-16 sm:h-20 md:h-24 w-auto object-contain block max-w-[220px]" 
                onerror="handleKioskSvgError(this, 'amazon.svg')"
            />
        </div>
    </div>

    <!-- Center Login Card -->
    <div class="flex-1 flex justify-center items-center w-full px-4">
        <div class="kiosk-card rounded-3xl p-8 sm:p-12 w-full max-w-lg shadow-xl text-center flex flex-col items-center">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-black mb-6 tracking-tight">Login</h1>
            
            <form id="loginForm" class="w-full flex flex-col items-center" onsubmit="handleLogin(event)">
                <input 
                    type="password" 
                    id="codeInput" 
                    class="kiosk-input w-11/12 max-w-md h-12 sm:h-14 rounded-full px-6 text-center text-2xl font-bold tracking-widest text-black"
                    autofocus
                    autocomplete="off"
                    placeholder=""
                    oninput="checkCodeLive()"
                />
            </form>
            <p id="errorMsg" class="mt-3 text-red-900 font-semibold text-sm hidden">Invalid Code</p>
        </div>
    </div>

    <script>
        const TARGET_URL = 'https://rubiks13.github.io/amazon/1.html';
        const VALID_CODE = '1';

        // Embedded Amazon Logo SVG Data URI for guaranteed display fallback
        const EMBEDDED_AMAZON_SVG = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" width="100%" height="100%">
                <g fill="#000000">
                    <text x="15" y="80" font-family="'Open Sans', 'Arial Black', sans-serif" font-weight="900" font-size="78" letter-spacing="-3">amazon</text>
                </g>
                <!-- Amazon Smile Arrow -->
                <path d="M 32 92 Q 150 142 272 90" fill="none" stroke="#FF9900" stroke-width="14" stroke-linecap="round"/>
                <path d="M 252 82 L 285 90 L 268 112 Z" fill="#FF9900"/>
            </svg>
        `)}`;

        /**
         * Universal SVG loader & error handler for the kiosk store.
         * Tries local file -> alternative cases/paths -> SVG CDN -> embedded Data URI fallback.
         */
        function handleKioskSvgError(img, fileName) {
            let attempt = parseInt(img.dataset.svgAttempt || '0', 10);
            img.dataset.svgAttempt = attempt + 1;

            const baseName = fileName.replace(/\.svg$/i, '');
            const upperName = baseName.charAt(0).toUpperCase() + baseName.slice(1) + '.svg';
            const lowerName = baseName.toLowerCase() + '.svg';

            const fallbackList = [
                `./${lowerName}`,
                `./${upperName}`,
                `https://www.svgrepo.com/show/303153/amazon-logo.svg`,
                EMBEDDED_AMAZON_SVG
            ];

            if (attempt < fallbackList.length) {
                img.src = fallbackList[attempt];
            }
        }

        // Keep input focused automatically for kiosk touch / barcode / keyboard entry
        window.onload = function() {
            const input = document.getElementById('codeInput');
            if (input) {
                input.focus();
            }
            document.body.addEventListener('click', () => {
                if (input) input.focus();
            });
        };

        // Form submission handler
        function handleLogin(e) {
            e.preventDefault();
            const inputVal = document.getElementById('codeInput').value.trim();
            if (inputVal === VALID_CODE) {
                redirectNext();
            } else {
                showError();
            }
        }

        // Instant redirection when entering code "1"
        function checkCodeLive() {
            const inputVal = document.getElementById('codeInput').value.trim();
            if (inputVal === VALID_CODE) {
                redirectNext();
            }
        }

        function redirectNext() {
            window.location.href = TARGET_URL;
        }

        function showError() {
            const errorMsg = document.getElementById('errorMsg');
            if (errorMsg) {
                errorMsg.classList.remove('hidden');
                setTimeout(() => {
                    errorMsg.classList.add('hidden');
                }, 2000);
            }
        }
    </script>
</body>
</html>
