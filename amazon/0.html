<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Kiosk - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background: repeating-linear-gradient(
                -45deg,
                #FA622E,
                #FA622E 35px,
                #ED7652 35px,
                #ED7652 70px
            );
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Soft salmon card background matching InDesign spec */
        .kiosk-card {
            background-color: #EE7D60;
        }

        .kiosk-card-logo {
            background-color: #EE7D60;
            border-bottom-right-radius: 2.5rem;
        }

        /* Black outlined pill input field */
        .kiosk-input {
            border: 3px solid #000000;
            outline: none;
            background-color: transparent;
        }

        .kiosk-input:focus {
            box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="relative w-screen h-screen flex flex-col justify-between items-center m-0 p-0">

    <!-- Top-left Amazon Logo Container -->
    <div class="absolute top-0 left-0">
        <div class="kiosk-card-logo p-6 md:p-8 pr-12 pb-8 flex items-center justify-center">
            <!-- Tries to load Amazon_Logo_0.svg with an SVG fallback if the file isn't uploaded yet in preview -->
            <img 
                src="Amazon_Logo_O.svg" 
                alt="Amazon Logo" 
                class="h-16 md:h-20 object-contain"
                onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 500 150\' width=\'250\'><path fill=\'%23000000\' d=\'M114.2 81.3c-14.8 2.1-22.1 7.2-22.1 16.5 0 9.8 7.3 15.3 18.5 15.3 12.5 0 20.3-6.6 22.8-17.7v-14.1c-5.7 0-11.8 0-19.2 0zm22.8-31.2v7.7c-5.8-6.1-13.8-9.4-23.4-9.4-18.7 0-33 13.2-33 33.3 0 20.3 14.1 33.7 33.8 33.7 9.8 0 17.6-3.1 23.3-9.5v8c0 10.3-6.2 15.6-17.6 15.6-8.9 0-15.6-3.2-18-9.1l-14.9 6.2c4.7 11.2 16.6 18.1 33.3 18.1 20 0 32.2-11.3 32.2-34.1V50.1h-15.7z\'/><path fill=\'%23FF9900\' d=\'M23.1 118c64.2 47.4 157.6 51.5 229.8 13.9 3.6-1.9 8.2.3 6.9 4.3-5.2 16.4-38.3 34.6-67.9 38.6-80 10.8-164.7-18-175.7-48.2-.8-2.3 2.1-4.7 4.5-3.3z\'/></svg>';"
            />
        </div>
    </div>

    <!-- Center Login Card -->
    <div class="flex-1 flex justify-center items-center w-full px-4">
        <div class="kiosk-card rounded-3xl p-8 sm:p-12 w-full max-w-lg shadow-xl text-center flex flex-col items-center">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-black mb-6 tracking-tight">Login</h1>
            
            <form id="loginForm" class="w-full flex flex-col items-center" onsubmit="handleLogin(event)">
                <input 
                    type="password" 
                    id="codeInput" 
                    class="kiosk-input w-11/12 max-w-md h-12 sm:h-14 rounded-full px-6 text-center text-2xl font-bold tracking-widest text-black"
                    autofocus
                    autocomplete="off"
                    placeholder=""
                    oninput="checkCodeLive()"
                />
            </form>
            <p id="errorMsg" class="mt-3 text-red-900 font-semibold text-sm hidden">Invalid Code</p>
        </div>
    </div>

    <script>
        const TARGET_URL = 'https://rubiks13.github.io/amazon/1.html';
        const VALID_CODE = '1';

        // Keep input focused automatically (ideal for kiosk setups)
        window.onload = function() {
            const input = document.getElementById('codeInput');
            input.focus();
            document.body.addEventListener('click', () => input.focus());
        };

        // Form submit handler (pressing Enter)
        function handleLogin(e) {
            e.preventDefault();
            const inputVal = document.getElementById('codeInput').value.trim();
            if (inputVal === VALID_CODE) {
                redirectNext();
            } else {
                showError();
            }
        }

        // Live input check (redirects instantly when '1' is entered)
        function checkCodeLive() {
            const inputVal = document.getElementById('codeInput').value.trim();
            if (inputVal === VALID_CODE) {
                redirectNext();
            }
        }

        function redirectNext() {
            // Redirects to github pages url as requested
            window.location.href = TARGET_URL;
        }

        function showError() {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.classList.remove('hidden');
            setTimeout(() => {
                errorMsg.classList.add('hidden');
            }, 2000);
        }
    </script>
</body>
</html>
